name: release

# Push a tag vX.Y.Z on a commit whose package.json version is X.Y.Z (see
# CONTRIBUTING.md, "Releasing"). This makes a GitHub release with the notes
# from CHANGELOG.md, and publishes @rainnworks/mouser-mcp to npm.
# npm is skipped until repository variable NPM_ENABLED=true. Variables are read
# when the run starts, so set it before pushing the tag.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  verify:
    name: tag matches package.json
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(jq -r .version package.json)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag does not match package.json ($file). Run 'npm version $tag --no-git-tag-version' first."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  github:
    name: github release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.verify.outputs.version }}" '
            $0 ~ "^## " && found { exit }
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: npm
    needs: verify
    # npm trusted publishing (OIDC): no token. The package's trusted publisher is
    # this repo and release.yml.
    if: vars.NPM_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5+)
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --access public --provenance
